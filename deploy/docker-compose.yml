# Run from this folder:  docker compose up -d --build
# Needs (see AWS.md): ../backend/.env with the API keys, and a `.env` next to
# this file containing  DOMAIN=your.domain.name
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../backend/.env
    volumes:
      # Everything the backend writes, so a redeploy/restart keeps it:
      - grid:/app/data/dynamic          # Copernicus SST/chlorophyll grid
      - profiles:/app/backend/data      # user profiles (SQLite)
      - weathercache:/app/backend/.cache
    expose:
      - "8000"

  # HTTPS in front of the API (certificates are issued and renewed automatically).
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  grid:
  profiles:
  weathercache:
  caddy_data:
  caddy_config:
